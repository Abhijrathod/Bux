[workspace]
members = [
    "crates/bux-core",
    "crates/bux-commands",
    "crates/bux-sdk",
    "crates/bux-security",
    "crates/bux-modules",
    "crates/bux-cli",
    "crates/bux-platform-unix",
    "crates/bux-platform-win",
    "crates/bux-native",
    "crates/bux-globaltool",
    "crates/bux-tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["bux contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/abhijrathod/bux"
keywords = ["shell", "cli", "terminal", "repl"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Core Utilities
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.10"

# Shell / REPL
colored = "2"
rustyline = "14"
crossterm = "0.27"

# System
dirs = "5"
git2 = "0.18"
hostname = "0.3"  # For get_hostname()

# Testing
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
